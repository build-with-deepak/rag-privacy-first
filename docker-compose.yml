# Three services: qdrant and api are internal-only (reached over the compose
# network by service name); web is the only one that binds a host port, and
# even that is bound to localhost — the VPS's own nginx (already fronting
# build-with-deepak.com and its sibling subdomains) reverse-proxies
# rag.build-with-deepak.com to 127.0.0.1:8090 and terminates TLS there. See
# nginx/rag.build-with-deepak.com.conf for that host-level config.
#
# Ollama is NOT a service here — it's already running on the VPS outside
# Docker. `extra_hosts` on api is what lets a container reach it at
# host.docker.internal despite that.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      - qdrant
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: https://rag.build-with-deepak.com
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DEMO_TOKEN_TTL: ${DEMO_TOKEN_TTL:-2h}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_GENERATION_MODEL: ${OLLAMA_GENERATION_MODEL:-llama3:8b}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-rag_documents}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-15728640}
      DOCUMENT_TTL_MS: ${DOCUMENT_TTL_MS:-3600000}
      CHUNK_WORDS: ${CHUNK_WORDS:-220}
      CHUNK_OVERLAP_WORDS: ${CHUNK_OVERLAP_WORDS:-40}
      MAX_CONCURRENT_INFERENCE: ${MAX_CONCURRENT_INFERENCE:-2}
      MAX_QUEUE_LENGTH: ${MAX_QUEUE_LENGTH:-20}
      RATE_LIMIT_TTL_MS: ${RATE_LIMIT_TTL_MS:-60000}
      RATE_LIMIT_LIMIT: ${RATE_LIMIT_LIMIT:-10}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '127.0.0.1:8090:80'

volumes:
  qdrant_storage:
