server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — this app has no server-side routing of its own, so any
    # path nginx doesn't otherwise recognize falls through to index.html and
    # lets the Angular router (or, here, just the app shell) take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE needs response buffering off, or nginx holds the whole stream in a
    # buffer before forwarding it — the visible token-by-token streaming and
    # the live queue-position updates would both arrive in one lump at the
    # end instead of as they happen.
    location /api/query/stream {
        proxy_pass http://api:3000/api/query/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Uploads can be up to the app's own configured limit (default 15MB) —
    # nginx's default 1MB body cap would reject a valid upload before the
    # request even reaches the API's own, more informative error.
    client_max_body_size 20M;
}
